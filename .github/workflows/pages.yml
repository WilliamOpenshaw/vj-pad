# Publishes the iPad version (the "iPad website" folder) to GitHub Pages.
name: iPad website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that both versions were rebuilt from the source
        run: |
          node source/build.mjs
          git diff --exit-code -- "VJ Pad.html" "iPad website/index.html" || { echo "Run: node source/build.mjs, then commit the result."; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: iPad website
      - id: deploy
        uses: actions/deploy-pages@v4
